name: Lab regression tests
on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/**', 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: lab-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release, sanitizers]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ qt6-base-dev qt6-tools-dev libqt6opengl6-dev libfftw3-dev libusb-1.0-0-dev xvfb libgl1-mesa-dri desktop-file-utils
      - name: Configure using shared developer preset
        run: cmake --preset linux-${{ matrix.configuration }}
      - name: Build
        run: cmake --build --preset linux-${{ matrix.configuration }}
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --preset linux-${{ matrix.configuration }}
      - name: Verify integrated workspace with software OpenGL
        if: matrix.configuration != 'sanitizers'
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: '1'
          OH_GUI_SCREENSHOT: ${{ runner.temp }}/workspace.png
        run: xvfb-run -a -s '-screen 0 1920x1080x24' build/linux-${{ matrix.configuration }}/openhantek/oh_regression integratedGuiSmoke
      - name: Upload workspace previews
        if: always() && matrix.configuration != 'sanitizers'
        uses: actions/upload-artifact@v4
        with:
          name: workspace-previews-${{ matrix.configuration }}
          path: ${{ runner.temp }}/workspace.png*
          if-no-files-found: ignore
          retention-days: 14
      - name: Package and verify Linux release installation
        if: matrix.configuration == 'release'
        run: |
          cpack --config build/linux-release/CPackConfig.cmake -G DEB
          package=(build/linux-release/packages/*.deb)
          test "${#package[@]}" -eq 1
          test "$(dpkg-deb -f "${package[0]}" Package)" = openhanteklab
          dpkg-deb -f "${package[0]}" Depends
          test -n "$(dpkg-deb -f "${package[0]}" Depends)"
          dpkg-deb -x "${package[0]}" "$RUNNER_TEMP/lab-package"
          root="$RUNNER_TEMP/lab-package/usr"
          test -x "$root/bin/OpenHantekLab"
          test ! -e "$root/bin/OpenHantek"
          test ! -e "$root/share/doc/openhantek"
          test -f "$root/share/doc/openhanteklab/LICENSE"
          test -f "$root/lib/udev/rules.d/60-openhanteklab.rules"
          test -f "$root/share/icons/hicolor/scalable/apps/io.github.CargoCultScientist.OpenHantekLab.svg"
          desktop-file-validate "$root/share/applications/io.github.CargoCultScientist.OpenHantekLab.desktop"
          sudo apt-get install -y "${PWD}/${package[0]}"
          QT_QPA_PLATFORM=offscreen /usr/bin/OpenHantekLab --help
      - name: Upload verified Debian package
        if: success() && matrix.configuration == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: OpenHantekLab-ubuntu-24.04-deb
          path: build/linux-release/packages/*.deb
          retention-days: 14
      - name: Upload verified Linux development binary
        if: success() && matrix.configuration != 'sanitizers'
        uses: actions/upload-artifact@v4
        with:
          name: OpenHantekLab-linux-${{ matrix.configuration }}
          path: build/linux-${{ matrix.configuration }}/openhantek/OpenHantekLab
          retention-days: 14
